method: gpadmm_full

common:
  dataset: mnist
  model: lenet
  seed: 1
  device: auto
  batch_size: 64
  test_batch_size: 128
  data_dir: ./data
  output_dir: ./output/gpadmm_mnist_lenet_smoke.jsonl
  save_dir: ./runs/gpadmm_mnist_lenet_smoke
  optimizer: adam
  lr: 0.001
  adam_epsilon: 0.00000001
  rho: 0.01
  alpha: 5e-4
  l2: false
  num_pre_epochs: 3
  save_checkpoint_every: 1

gpadmm:
  gpadmm_prune_scope: global
  sparsity: 0.95
  sparsity_method: uniform
  num_cycles: 2
  grow_interval: 2
  num_re_epochs: 1
  c: 0.5
  min_layer_keep_ratio: 0.01
