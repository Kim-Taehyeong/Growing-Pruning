method: gpadmm_full

common:
  dataset: cifar10
  model: resnet56
  cifar_pretrained: true
  min_dense_acc: 20.0
  seed: 1
  device: auto
  batch_size: 256
  test_batch_size: 512
  data_dir: ~/imagenet
  output_dir: ./output/gpadmm_cifar10_resnet56_pretrained_global_sgd_c0.3.jsonl
  save_dir: ./runs/gpadmm_cifar10_resnet56_pretrained_global_sgd_c0.3
  optimizer: sgd
  lr: 0.01
  momentum: 0.9
  weight_decay: 0.0005
  nesterov: true
  rho: 0.01
  alpha: 5e-4
  l1: false
  l2: false
  num_pre_epochs: 0
  save_checkpoint_every: 1

gpadmm:
  gpadmm_prune_scope: global
  sparsity: 0.9
  num_cycles: 5
  grow_interval: 5
  num_re_epochs: 10
  c: 0.3
  min_layer_keep_ratio: 0.01
