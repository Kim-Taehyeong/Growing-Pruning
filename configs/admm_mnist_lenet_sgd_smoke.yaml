method: admm

common:
  dataset: mnist
  model: lenet
  seed: 1
  device: auto
  batch_size: 64
  test_batch_size: 128
  data_dir: ./data
  output_dir: ./output/admm_mnist_lenet_sgd_smoke.jsonl
  save_dir: ./runs/admm_mnist_lenet_sgd_smoke
  optimizer: sgd
  lr: 0.01
  momentum: 0.9
  weight_decay: 0.0
  nesterov: false
  rho: 0.01
  alpha: 5e-4
  l1: false
  l2: false
  num_pre_epochs: 3
  save_checkpoint_every: 1

admm:
  sparsity: 0.95
  num_epochs: 2
  num_re_epochs: 1
